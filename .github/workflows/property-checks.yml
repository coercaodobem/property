name: Validate Property

on:
  pull_request:
    branches: [modelo-mvp]
  push:
    branches: [modelo-mvp]
  workflow_dispatch:
    inputs:
      run_deferred_platforms:
        description: Run the deferred Windows and macOS native matrix now
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: property-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            property
            .github
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate product with local fixtures
        run: bash property/tests/run-smoke.sh

  native-relay:
    name: Native relay (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            property
            .github
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Relay with bundled runtime and persistent data
        run: node property/tests/native-relay-integration.mjs

  native-relay-deferred:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_deferred_platforms == 'true' }}
    name: Native relay (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            property
            .github
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Relay with bundled runtime and persistent data
        run: node property/tests/native-relay-integration.mjs
